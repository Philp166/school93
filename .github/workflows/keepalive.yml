name: keepalive

on:
  schedule:
    # Каждые 10 минут — Render усыпляет сайт после ~15 минут без запросов
    - cron: "*/10 * * * *"
  workflow_dispatch: # ручной запуск из вкладки Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the site
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://school93.onrender.com/robots.txt)
          echo "HTTP $code"
          test "$code" = "200"
